version: "3.8"

networks:
  cluster-net:
    driver: bridge
  client-net:
    driver: bridge

volumes:
  cass1-data:
  cass2-data:
  cass3-data:

services:

  cass1:
    image: cassandra:4.1
    container_name: cass1
    hostname: cass1
    networks:
      - cluster-net
      - client-net
    env_file: .env
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      CASSANDRA_NUM_TOKENS: ${CASSANDRA_NUM_TOKENS}
      CASSANDRA_BROADCAST_ADDRESS: cass1
      CASSANDRA_LISTEN_ADDRESS: cass1
      CASSANDRA_RPC_ADDRESS: ${CASSANDRA_RPC_ADDRESS}
      CASSANDRA_SEEDS: ${CASSANDRA_SEEDS_CASS1}
    volumes:
      - cass1-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 20s
      retries: 15
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  cass2:
    image: cassandra:4.1
    container_name: cass2
    hostname: cass2
    networks:
      - cluster-net
      - client-net
    depends_on:
      cass1:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      CASSANDRA_NUM_TOKENS: ${CASSANDRA_NUM_TOKENS}
      CASSANDRA_BROADCAST_ADDRESS: cass2
      CASSANDRA_LISTEN_ADDRESS: cass2
      CASSANDRA_RPC_ADDRESS: ${CASSANDRA_RPC_ADDRESS}
      CASSANDRA_SEEDS: ${CASSANDRA_SEEDS_CASS2}
    volumes:
      - cass2-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 20s
      retries: 15

  cass3:
    image: cassandra:4.1
    container_name: cass3
    hostname: cass3
    networks:
      - cluster-net
      - client-net
    depends_on:
      cass1:
        condition: service_healthy
      cass2:
        condition: service_healthy
    env_file: .env
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      CASSANDRA_NUM_TOKENS: ${CASSANDRA_NUM_TOKENS}
      CASSANDRA_BROADCAST_ADDRESS: cass3
      CASSANDRA_LISTEN_ADDRESS: cass3
      CASSANDRA_RPC_ADDRESS: ${CASSANDRA_RPC_ADDRESS}
      CASSANDRA_SEEDS: ${CASSANDRA_SEEDS_CASS3}
    volumes:
      - cass3-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 20s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25
    container_name: cass_nginx
    networks:
      - client-net
    ports:
      - "9042:9042"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cass1:
        condition: service_healthy
      cass2:
        condition: service_healthy
      cass3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  service_a:
    build: ./service_a
    networks:
      - client-net
    ports:
      - "8000:8000"
    depends_on:
      cass1:
        condition: service_healthy
      cass2:
        condition: service_healthy
      cass3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/slow"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'       
          memory: 512M      
        reservations:
          cpus: '0.25'      
          memory: 256M  
    environment:
      CASSANDRA_HOST: ${CASSANDRA_HOST}
      CASSANDRA_PORT: ${CASSANDRA_PORT}

  service_b:
    build: ./service_b
    networks:
        - client-net
    ports:
        - "8001:8000" 
    depends_on:
        cass1:
          condition: service_healthy
        cass2:
          condition: service_healthy
        cass3:
          condition: service_healthy
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/slow"]
        interval: 15s
        timeout: 5s
        retries: 5
    logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      CASSANDRA_HOST: ${CASSANDRA_HOST}
      CASSANDRA_PORT: ${CASSANDRA_PORT}
  
  grpc_api:
    build: ./grpc_service
    container_name: grpc_api
    networks:
      - client-net
    depends_on:
      cass1:
        condition: service_healthy
      cass2:
        condition: service_healthy
      cass3:
        condition: service_healthy
    environment:
      CASSANDRA_HOST: cass_nginx
      CASSANDRA_PORT: 9042
    ports:
    - "50051:50051"