version: "3.8"

networks:
  cluster-net:
    driver: bridge
  client-net:
    driver: bridge

volumes:
  cass1-data:
  cass2-data:
  cass3-data:

services:

  cass1:
    image: cassandra:4.1
    container_name: cass_1
    hostname: cass1
    networks:
      - cluster-net
      - client-net
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_NUM_TOKENS=256
      - CASSANDRA_BROADCAST_ADDRESS=auto
      - CASSANDRA_LISTEN_ADDRESS=auto
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
    volumes:
      - cass1-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 20s
      retries: 15
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  cass2:
    image: cassandra:4.1
    container_name: cass_2
    hostname: cass2
    networks:
      - cluster-net
      - client-net
    depends_on:
      cass1:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_NUM_TOKENS=256
      - CASSANDRA_BROADCAST_ADDRESS=auto
      - CASSANDRA_LISTEN_ADDRESS=auto
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_SEEDS=cass1
    volumes:
      - cass2-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 20s
      retries: 15

  cass3:
    image: cassandra:4.1
    container_name: cass_3
    hostname: cass3
    networks:
      - cluster-net
      - client-net
    depends_on:
      cass1:
        condition: service_healthy
      cass2:
        condition: service_healthy
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_NUM_TOKENS=256
      - CASSANDRA_BROADCAST_ADDRESS=auto
      - CASSANDRA_LISTEN_ADDRESS=auto
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_SEEDS=cass1,cass2
    volumes:
      - cass3-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 20s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25
    container_name: cass_nginx
    networks:
      - client-net
    ports:
      - "9042:9042"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cass1:
        condition: service_healthy
      cass2:
        condition: service_healthy
      cass3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  service_a:
    build: ./service_a
    networks:
      - client-net
    ports:
      - "8000:8000"
    depends_on:
      cass1:
        condition: service_healthy
      cass2:
        condition: service_healthy
      cass3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/slow"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'       
          memory: 512M      
        reservations:
          cpus: '0.25'      
          memory: 256M  
    environment:
      - CASSANDRA_HOST=cass_nginx
      - CASSANDRA_PORT=9042

  service_b:
    build: ./service_b
    networks:
        - client-net
    ports:
        - "8001:8000" 
    depends_on:
        cass1:
          condition: service_healthy
        cass2:
          condition: service_healthy
        cass3:
          condition: service_healthy
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/slow"]
        interval: 15s
        timeout: 5s
        retries: 5
    logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      - CASSANDRA_HOST=cass_nginx
      - CASSANDRA_PORT=9042