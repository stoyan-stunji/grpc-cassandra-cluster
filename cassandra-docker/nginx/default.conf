upstream cassandra_cluster {
    server cass1:9042;
    server cass2:9042;
    server cass3:9042;
    # TCP
}

server {
    listen 9042;

    location / {
        proxy_pass http://cassandra_cluster;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_connect_timeout 1s;
        proxy_read_timeout 1s;
    }
}

server {
    listen 8080;

    location / {
        return 200 'Cluster is good';
        add_header Content-Type text/plain;
    }
}
